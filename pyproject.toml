[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "single-project-evaluator"
version = "0.1.0"
description = "Read-only single-project evaluation spine for City Hall governed projects."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
single-project-evaluator = "single_project_evaluator.cli:main"
spe = "single_project_evaluator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
